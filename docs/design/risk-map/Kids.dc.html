<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>きけん マップ（こども）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
rt{font-size:0.5em;font-weight:500}
</style>
</helmet>
<div style="width: 390px; min-height: 980px; box-sizing: border-box; background: #FFF8EC; font-family: 'Hiragino Maru Gothic ProN', 'BIZ UDPGothic', system-ui, sans-serif; color: #1F2A44; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px">

  <h2 style="margin: 0; font-size: 24px; font-weight: 900; line-height: 1.4">おうちの まわりの<br>きけん マップ</h2>

  <div style="background: #FFFFFF; border-radius: 20px; border: 2px solid #EADFCB; padding: 10px">
    <svg width="334" height="368" viewBox="0 0 338 372" role="img" aria-label="おうちは むらさきの マス。みどりの やじるしの ほうへ にげる">
      <defs>
        <pattern id="kwv" width="12" height="8" patternUnits="userSpaceOnUse">
          <path d="M0 6 Q3 2 6 6 T12 6" fill="none" stroke="#0C447C" stroke-width="1.3" opacity="0.55"></path>
        </pattern>
        <marker id="kah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
          <path d="M1 1 L9 5 L1 9 Z" fill="#1B6E3C"></path>
        </marker>
      </defs>
      <rect x="0" y="0" width="338" height="372" rx="10" fill="#CFE3F5"></rect>
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="80">
        <rect x="{{c.x}}" y="{{c.y}}" width="29" height="29" fill="{{c.fill}}" stroke="#FFFFFF" stroke-width="1"></rect>
      </sc-for>
      <sc-for list="{{waves}}" as="w" hint-placeholder-count="20">
        <rect x="{{w.x}}" y="{{w.y}}" width="29" height="29" fill="url(#kwv)"></rect>
      </sc-for>
      <text x="300" y="350" font-size="15" font-weight="900" fill="#185FA5" text-anchor="end">うみ</text>
      <path d="M200 196 L84 110" stroke="#1B6E3C" stroke-width="9" stroke-linecap="round" fill="none" marker-end="url(#kah)"></path>
      <rect x="40" y="60" width="64" height="36" rx="10" fill="#1B6E3C"></rect>
      <text x="72" y="84" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">たかだい</text>
      <circle cx="204" cy="198" r="13" fill="#1F2A44" stroke="#FFFFFF" stroke-width="3"></circle>
      <rect x="214" y="208" width="72" height="28" rx="14" fill="#1F2A44"></rect>
      <text x="250" y="227" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle">おうち</text>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 12px; border: 2px solid #EADFCB">
      <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true"><rect width="40" height="30" rx="6" fill="#8E7CC3"></rect><rect width="40" height="30" rx="6" fill="url(#kwv)"></rect></svg>
      <div style="font-size: 17px; font-weight: 700; line-height: 1.5">いえが こわれやすく、<br>つなみも くる ところ</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 12px; border: 2px solid #EADFCB">
      <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true"><rect width="40" height="30" rx="6" fill="#8FBCE8"></rect><rect width="40" height="30" rx="6" fill="url(#kwv)"></rect></svg>
      <div style="font-size: 17px; font-weight: 700; line-height: 1.5">つなみが くる ところ</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 16px; padding: 12px; border: 2px solid #EADFCB">
      <svg width="40" height="30" viewBox="0 0 40 30" aria-hidden="true"><rect width="40" height="30" rx="6" fill="#E8A33D"></rect></svg>
      <div style="font-size: 17px; font-weight: 700; line-height: 1.5">いえが こわれやすい ところ</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 14px; background: #FFFFFF; border-radius: 20px; padding: 16px; border: 3px solid #D9381E">
    <svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"><path d="M4 20 L40 20" stroke="#1B6E3C" stroke-width="8" stroke-linecap="round"></path><path d="M34 6 L54 20 L34 34 Z" fill="#1B6E3C"></path></svg>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 14px; font-weight: 700; color: #B3261E">ゆれが とまったら すぐ</div>
      <div style="font-size: 22px; font-weight: 900">みどりの やじるしの ほうへ にげる</div>
    </div>
  </div>

  <div style="font-size: 14px; line-height: 1.6; color: #3E4658; text-align: center">みちは おうちの ひとと いっしょに たしかめてね。<br>はいいろの ところも、ゆだんは しないでね。</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    var COLS = 11, ROWS = 12, S = 30, OX = 4, OY = 6;
    function coast(r) { return 8 + (r % 4 === 1 ? 1 : 0) - (r > 8 ? 1 : 0) + (r < 2 ? 1 : 0); }
    var cells = [], waves = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cc = coast(r);
        if (c >= cc) continue;
        var hill = (c <= 2 && r <= 4) || (c <= 1 && r <= 7);
        var tsu = !hill && r >= 2 && c >= cc - 3;
        var town = c >= 3 && c <= 7 && r >= 3 && r <= 9;
        var high = !hill && (town || (tsu && r >= 5 && r <= 10)) && !(c === 3 && r === 9);
        var fill = tsu && high ? '#8E7CC3' : tsu ? '#8FBCE8' : high ? '#E8A33D' : hill ? '#D7EBC8' : '#E3E1DA';
        var x = OX + c * S, y = OY + r * S;
        cells.push({ x: x, y: y, fill: fill });
        if (tsu) waves.push({ x: x, y: y });
      }
    }
    return { cells: cells, waves: waves };
  }
}
</script>
</body>
</html>
