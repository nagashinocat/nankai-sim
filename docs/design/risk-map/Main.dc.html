<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>周辺の危険マップ（おとな）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1f4fa8}a:hover{color:#163a7d}
</style>
</helmet>
<div style="width: 390px; min-height: 1180px; box-sizing: border-box; background: #F7F6F2; font-family: 'Hiragino Sans', 'BIZ UDPGothic', system-ui, sans-serif; color: #1F2A44; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 4px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 700">周辺1kmの危険マップ</h2>
    <div style="font-size: 13px; color: #5A6377">250mマスごとの推計（図は模式のれい）</div>
  </div>

  <div role="group" aria-label="地図の表示" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; background: #E7E4DC; border-radius: 14px; padding: 5px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="font-family: inherit; font-size: 15px; font-weight: 700; min-height: 44px; border: 0; border-radius: 10px; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
    </sc-for>
  </div>

  <div style="background: #FFFFFF; border-radius: 16px; border: 1px solid #DDD9CF; padding: 10px; display: flex; flex-direction: column; gap: 8px">
    <svg width="338" height="372" viewBox="0 0 338 372" role="img" aria-label="{{mapAlt}}">
      <defs>
        <pattern id="wv" width="10" height="7" patternUnits="userSpaceOnUse">
          <path d="M0 5 Q2.5 1.5 5 5 T10 5" fill="none" stroke="#0C447C" stroke-width="1.1" opacity="0.55"></path>
        </pattern>
        <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M1 1 L9 5 L1 9 Z" fill="#1B6E3C"></path>
        </marker>
      </defs>
      <rect x="0" y="0" width="338" height="372" rx="10" fill="#CFE3F5"></rect>
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="80">
        <rect x="{{c.x}}" y="{{c.y}}" width="29" height="29" fill="{{c.fill}}" stroke="#FFFFFF" stroke-width="1"></rect>
      </sc-for>
      <sc-for list="{{waves}}" as="w" hint-placeholder-count="20">
        <rect x="{{w.x}}" y="{{w.y}}" width="29" height="29" fill="url(#wv)"></rect>
      </sc-for>
      <text x="300" y="350" font-size="13" font-weight="700" fill="#185FA5" text-anchor="end">うみ</text>
      <circle cx="166" cy="166" r="150" fill="none" stroke="#5A6377" stroke-width="1.2" stroke-dasharray="5 4"></circle>
      <sc-if value="{{showArrow}}" hint-placeholder-val="{{ true }}">
        <path d="M200 196 L84 110" stroke="#1B6E3C" stroke-width="5" stroke-linecap="round" fill="none" marker-end="url(#ah)"></path>
        <rect x="56" y="74" width="44" height="26" rx="6" fill="#1B6E3C"></rect>
        <path d="M66 87 L74 80 L82 87 L82 94 L66 94 Z" fill="#FFFFFF"></path>
        <text x="86" y="92" font-size="11" font-weight="700" fill="#FFFFFF">1</text>
        <rect x="104" y="148" width="104" height="24" rx="12" fill="#FFFFFF" stroke="#1B6E3C" stroke-width="1.5"></rect>
        <text x="156" y="165" font-size="12" font-weight="700" fill="#1B6E3C" text-anchor="middle">逃げる方向</text>
      </sc-if>
      <circle cx="204" cy="198" r="10" fill="#1F2A44" stroke="#FFFFFF" stroke-width="3"></circle>
      <text x="220" y="220" font-size="13" font-weight="700" fill="#1F2A44">自宅</text>
      <path d="M318 20 L324 34 L318 31 L312 34 Z" fill="#1F2A44"></path>
      <text x="318" y="48" font-size="11" font-weight="700" fill="#1F2A44" text-anchor="middle">北</text>
    </svg>

    <div role="list" aria-label="凡例" style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{legend}}" as="l" hint-placeholder-count="4">
        <div role="listitem" style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.4">
          <svg width="28" height="20" viewBox="0 0 28 20" aria-hidden="true">
            <rect x="0" y="0" width="28" height="20" rx="4" fill="{{l.fill}}"></rect>
            <sc-if value="{{l.wave}}" hint-placeholder-val="{{ false }}">
              <rect x="0" y="0" width="28" height="20" rx="4" fill="url(#wv)"></rect>
            </sc-if>
          </svg>
          <div><strong>{{l.title}}</strong><span style="color: #3E4658">　{{l.desc}}</span></div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{showArrow}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.5; background: #EAF5EE; border-radius: 10px; padding: 8px 10px">
        <svg width="28" height="20" viewBox="0 0 28 20" aria-hidden="true"><path d="M3 10 L22 10" stroke="#1B6E3C" stroke-width="4" stroke-linecap="round"></path><path d="M18 4 L26 10 L18 16 Z" fill="#1B6E3C"></path></svg>
        <div><strong>逃げる方向</strong>：津波の避難場所「1」へ 北西に約450m（直線。道は実際に確かめてください）</div>
      </div>
    </sc-if>
  </div>

  <div style="background: #FFFFFF; border-radius: 16px; border: 2px solid #6E5BB0; padding: 14px; display: flex; gap: 14px; align-items: center">
    <div role="img" aria-label="自宅は 倒壊が大きく 津波もあるマスに入っています" style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; width: 92px">
      <div style="height: 40px; border-radius: 6px; background: #8FBCE8"></div>
      <div style="height: 40px; border-radius: 6px; background: #8E7CC3; display: flex; align-items: center; justify-content: center"><span style="width: 14px; height: 14px; border-radius: 7px; background: #1F2A44; border: 2px solid #FFFFFF"></span></div>
      <div style="height: 40px; border-radius: 6px; background: #E3E1DA"></div>
      <div style="height: 40px; border-radius: 6px; background: #E8A33D"></div>
      <div style="grid-column: 1 / 3; display: flex; justify-content: space-between; font-size: 11px; color: #5A6377"><span>倒壊 小</span><span>大</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 700; color: #5A6377">自宅はここ</div>
      <div style="font-size: 20px; font-weight: 800; color: #4A3A8C">両方に注意</div>
      <div style="font-size: 14px; line-height: 1.5">家の耐震化と家具の固定。揺れが収まったら、すぐ高い所へ。</div>
    </div>
  </div>

  <div style="font-size: 13px; line-height: 1.6; color: #3E4658; display: flex; flex-direction: column; gap: 4px">
    <div>・倒壊「大きい」＝全壊率の推計が10%以上のマス</div>
    <div>・津波＝浸水の想定があるマス（波の模様。色が分かりにくくても見分けられます）</div>
    <div>・灰色も安全という意味ではありません。想定を超える揺れや津波もあり得ます</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'both' }; }
  renderVals() {
    var self = this;
    var mode = this.state.mode;
    var COLS = 11, ROWS = 12, S = 30, OX = 4, OY = 6;
    function coast(r) { return 8 + (r % 4 === 1 ? 1 : 0) - (r > 8 ? 1 : 0) + (r < 2 ? 1 : 0); }
    var cells = [], waves = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cc = coast(r);
        if (c >= cc) continue;
        var hill = (c <= 2 && r <= 4) || (c <= 1 && r <= 7);
        var tsu = !hill && r >= 2 && c >= cc - 3;
        var town = c >= 3 && c <= 7 && r >= 3 && r <= 9;
        var coastLiq = tsu && r >= 5 && r <= 10;
        var high = !hill && (town || coastLiq) && !(c === 3 && r === 9);
        var fill;
        if (mode === 'shake') fill = hill ? '#EEEBE3' : high ? '#E8A33D' : '#F6D58E';
        else if (mode === 'tsunami') fill = tsu ? '#8FBCE8' : '#EEEBE3';
        else fill = tsu && high ? '#8E7CC3' : tsu ? '#8FBCE8' : high ? '#E8A33D' : '#E3E1DA';
        var x = OX + c * S, y = OY + r * S;
        cells.push({ x: x, y: y, fill: fill });
        if (tsu && mode !== 'shake') waves.push({ x: x, y: y });
      }
    }
    var defs = [
      { id: 'shake', label: '揺れ' },
      { id: 'tsunami', label: '津波' },
      { id: 'both', label: '両方' }
    ];
    var modes = defs.map(function (d) {
      var on = d.id === mode;
      return { label: d.label, pressed: on ? 'true' : 'false', bg: on ? '#1F2A44' : 'transparent', fg: on ? '#FFFFFF' : '#1F2A44',
        pick: function () { self.setState({ mode: d.id }); } };
    });
    var legends = {
      shake: [
        { fill: '#E8A33D', wave: false, title: '倒壊の危険 大', desc: '耐震化・家具の固定を' },
        { fill: '#F6D58E', wave: false, title: '倒壊の危険 中', desc: '古い家は特に注意' },
        { fill: '#EEEBE3', wave: false, title: '比較的低い', desc: '備えは同じく必要' }
      ],
      tsunami: [
        { fill: '#8FBCE8', wave: true, title: '津波の浸水想定', desc: '揺れたらすぐ高い所へ' },
        { fill: '#EEEBE3', wave: false, title: '想定なし', desc: '想定を超える津波もあり得ます' }
      ],
      both: [
        { fill: '#8E7CC3', wave: true, title: '両方に注意', desc: '耐震化＋すぐ避難' },
        { fill: '#8FBCE8', wave: true, title: 'すぐ高い所へ', desc: '津波に注意' },
        { fill: '#E8A33D', wave: false, title: '家の倒壊に注意', desc: '耐震化・家具の固定' },
        { fill: '#E3E1DA', wave: false, title: '比較的低い', desc: '備えは同じく必要' }
      ]
    };
    var alts = {
      shake: '揺れの地図。自宅のまわりは倒壊の危険が大きいマスが多い',
      tsunami: '津波の地図。海側の3マスほどに浸水の想定。自宅は浸水想定の中。北西の避難場所へ逃げる矢印',
      both: '両方の地図。自宅は倒壊も津波もあるマス。北西の避難場所へ逃げる矢印'
    };
    return { modes: modes, cells: cells, waves: waves, legend: legends[mode], showArrow: mode !== 'shake', mapAlt: alts[mode] };
  }
}
</script>
</body>
</html>
