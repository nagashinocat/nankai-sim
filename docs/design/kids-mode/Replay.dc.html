<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>さいせい（こどもモード）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f4fa8}a:hover{color:#163a7d}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF8EC; font-family: 'Zen Maru Gothic', sans-serif; color: #1F2A44; padding: 16px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px; font-size: 16px; font-weight: 700; color: #1F2A44; text-decoration: none">← もどる</a>
    <div style="font-size: 16px; font-weight: 700">うごきで みる</div>
    <div style="width: 56px"></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px" role="list" aria-label="ばめん">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <button type="button" role="listitem" onClick="{{s.pick}}" style="font-family: inherit; font-size: 14px; font-weight: 700; min-height: 44px; border-radius: 12px; border: 2px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</button>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 10px; background: #1F2A44; color: #FFFFFF; border-radius: 16px; padding: 10px">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
      <circle cx="14" cy="14" r="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"></circle>
      <path d="M14 7 L14 14 L19 17" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
    </svg>
    <div style="font-size: 20px; font-weight: 900">じしんから {{clock}}</div>
  </div>

  <div style="position: relative; height: 260px; border-radius: 20px; overflow: hidden; background: #EAF4FF" role="img" aria-label="{{sceneAlt}}">
    <sc-if value="{{isWave}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; right: 0; bottom: 40px; width: 150px; height: 90px; background: #4BA3E3; border-top-left-radius: 80px"></div>
    </sc-if>
    <div style="position: absolute; right: 0; bottom: 0; width: 120px; height: 40px; background: #4BA3E3"></div>
    <div style="position: absolute; left: 0; right: 120px; bottom: 0; height: 40px; background: #CDB89A"></div>
    <div style="position: absolute; left: 18px; bottom: 40px; width: 70px; height: 150px; background: #FFFFFF; border: 3px solid #5A6377; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 10px; box-sizing: border-box; gap: 8px">
      <div style="width: 40px; height: 12px; background: #C8D3E3; border-radius: 3px"></div>
      <div style="width: 40px; height: 12px; background: #C8D3E3; border-radius: 3px"></div>
      <div style="width: 40px; height: 12px; background: #C8D3E3; border-radius: 3px"></div>
      <div style="font-size: 12px; font-weight: 700">たかい<br>たてもの</div>
    </div>
    <div style="position: absolute; left: 170px; bottom: 40px; width: 70px; height: 60px; transform: {{shake}}">
      <svg width="70" height="60" viewBox="0 0 70 60" aria-hidden="true">
        <path d="M2 28 L35 4 L68 28 Z" fill="#8B6F5A"></path>
        <rect x="10" y="28" width="50" height="32" fill="#FFFFFF" stroke="#8B6F5A" stroke-width="3"></rect>
      </svg>
    </div>
    <div style="position: absolute; left: {{kidX}}; bottom: 40px; width: 20px; height: 44px">
      <svg width="20" height="44" viewBox="0 0 20 44" aria-hidden="true">
        <circle cx="10" cy="7" r="7" fill="#F28C28"></circle>
        <rect x="4" y="15" width="12" height="29" rx="5" fill="#F28C28"></rect>
      </svg>
    </div>
    <div style="position: absolute; left: 12px; top: 12px; font-size: 13px; font-weight: 700; color: #5A6377">もしきず（ほんとうの きょりとは ちがいます）</div>
  </div>

  <div aria-live="polite" style="background: #FFFFFF; border-radius: 20px; padding: 16px; border: 3px solid {{capBorder}}; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 15px; font-weight: 700; color: {{capColor}}">{{capSmall}}</div>
    <div style="font-size: 26px; font-weight: 900; line-height: 1.4">{{capBig}}</div>
    <div style="font-size: 15px; line-height: 1.6">{{capNote}}</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: auto">
    <button type="button" onClick="{{prev}}" style="font-family: inherit; font-size: 18px; font-weight: 900; min-height: 56px; border-radius: 16px; border: 2px solid #1F2A44; background: #FFFFFF; color: #1F2A44">まえへ</button>
    <button type="button" onClick="{{next}}" style="font-family: inherit; font-size: 18px; font-weight: 900; min-height: 56px; border-radius: 16px; border: 0; background: #2F6FDB; color: #FFFFFF">つぎへ</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var scenes = [
      { label: 'ゆれ', clock: '0ぷん', small: 'いま なにを する？', big: 'あたまを まもる', note: 'ひくく なって うごかない。ゆれは ながく つづく ことが あるよ。', shake: 'rotate(-4deg) translateX(-3px)', kid: '196px', wave: false, alt: 'いえが ゆれて いる', red: false },
      { label: 'にげる', clock: '5ふん', small: 'ゆれが とまったら すぐ', big: 'たかい ところへ にげる', note: 'ちかくの たかい たてものや たかだいへ。にもつは いらない。', shake: 'none', kid: '120px', wave: false, alt: 'たかい たてものへ はしって いる', red: true },
      { label: 'つなみ', clock: '3ぷん〜', small: 'つなみが くるよ', big: 'もどっては だめ', note: 'はやいと 3ぷんで うみに つく。いちど にげたら、つなみが おわるまで もどらない。', shake: 'none', kid: '48px', wave: true, alt: 'うみから つなみが きて いる。こどもは たかい たてものに いる', red: true },
      { label: 'あと', clock: 'そのあと', small: 'にげた あと', big: 'きめた ばしょで あう', note: 'かぞくと きめた ばしょで まとう。れんらくは 171で。', shake: 'none', kid: '48px', wave: true, alt: 'たかい たてもので まって いる', red: false }
    ];
    var self = this;
    var i = this.state.i;
    var cur = scenes[i];
    var steps = scenes.map(function (s, k) {
      var on = k === i;
      return { label: (k + 1) + '. ' + s.label, pick: function () { self.setState({ i: k }); },
        bg: on ? '#2F6FDB' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F2A44', border: on ? '#2F6FDB' : '#C9CFD8' };
    });
    return {
      steps: steps, clock: cur.clock, capSmall: cur.small, capBig: cur.big, capNote: cur.note,
      shake: cur.shake, kidX: cur.kid, isWave: cur.wave, sceneAlt: cur.alt,
      capBorder: cur.red ? '#D9381E' : '#2F6FDB', capColor: cur.red ? '#B3261E' : '#2F6FDB',
      prev: function () { self.setState({ i: Math.max(0, i - 1) }); },
      next: function () { self.setState({ i: Math.min(scenes.length - 1, i + 1) }); }
    };
  }
}
</script>
</body>
</html>
